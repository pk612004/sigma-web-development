
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon Says Game</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="game">
    <h1>Simon Says</h1>
    <h2 id="message">Press any key or Start Game</h2>

    <div class="scoreboard">
      <p>Current Level: <span id="level">0</span></p>
      <p>Best Level: <span id="best">0</span></p>
    </div>

    <button id="start-btn">Start Game</button>

    <div class="game-board">
      <button class="btn red" id="red" aria-label="Red"></button>
      <button class="btn yellow" id="yellow" aria-label="Yellow"></button>
      <button class="btn blue" id="blue" aria-label="Blue"></button>
      <button class="btn green" id="green" aria-label="Green"></button>
    </div>

    <p class="instructions">
      Watch the sequence, then repeat it in the same order.
    </p>
  </main>
</body>
</html>
